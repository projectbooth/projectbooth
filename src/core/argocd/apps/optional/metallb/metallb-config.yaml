# The actual IP pool — a plain-manifests Application, not a Helm chart, because
# this is pure config: your network's address range, not a piece of software.
# Wave 1 so the MetalLB controller (wave 0) is already healthy before these
# CRs get created.
#
# Optional (2026-08-31) — only synced alongside metallb.yaml itself, when
# install.sh applies optional/metallb-app.yaml (see README.md's "Portability"
# section).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  labels:
    platform.io/tier: optional
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # Hardcoded, not __REPO_URL__/__REVISION__ — see README.md ("Self-referencing
  # apps") for why: install.sh's placeholder substitution only ever touches
  # root-app.yaml, never the files under apps/, which Argo CD reads straight
  # from git with no templating of its own.
  source:
    repoURL: git@github.com:DougallPercival/opendataplatform.git
    targetRevision: dev
    path: src/core/argocd/manifests
    directory:
      include: "metallb-pool.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
