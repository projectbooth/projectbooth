# Split from cert-manager.yaml on purpose: the ClusterIssuer/Certificate CRs
# in manifests/cluster-issuer.yaml can't exist until cert-manager's own CRDs
# are registered, so this is wave 1 — one wave after the controller (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # Hardcoded, not __REPO_URL__/__REVISION__ — see README.md ("Self-referencing
  # apps") for why: install.sh's placeholder substitution only ever touches
  # root-app.yaml, never the files under apps/, which Argo CD reads straight
  # from git with no templating of its own.
  source:
    repoURL: git@github.com:DougallPercival/opendataplatform.git
    targetRevision: dev
    path: src/core/argocd/manifests
    directory:
      include: "cluster-issuer.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
