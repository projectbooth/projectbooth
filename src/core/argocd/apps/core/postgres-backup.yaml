# The ObjectStore + ScheduledBackup + bucket-creation Job — see
# manifests/postgres-backup.yaml for the full design writeup and its TODO.
# Wave 2: needs the ObjectStore CRD registered by postgres-backup-plugin.yaml
# (wave 1), same "needs previous wave's CRDs, not just applied but
# registered" reasoning as keycloak-instance.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-backup
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  # Hardcoded, not __REPO_URL__/__REVISION__ — see README.md ("Self-referencing
  # apps") for why: install.sh's placeholder substitution only ever touches
  # root-app.yaml, never the files under apps/, which Argo CD reads straight
  # from git with no templating of its own.
  source:
    repoURL: git@github.com:DougallPercival/opendataplatform.git
    targetRevision: dev
    path: src/core/argocd/manifests
    directory:
      include: "postgres-backup.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
