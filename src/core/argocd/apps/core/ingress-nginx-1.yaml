apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # wants MetalLB (wave 0) up first for its LoadBalancer IP
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3   # check for newer: https://github.com/kubernetes/ingress-nginx/releases
    helm:
      values: |
        controller:
          service:
            type: LoadBalancer
          ingressClassResource:
            default: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  # 2026-09-15, hit live on the ephemeral-test cloud environment (infra/ephemeral-test/), and latent
  # on homelab-dev too (just not yet hit — a timing race, not environment-specific): the chart's
  # admission-webhook Job generates a self-signed cert and patches it into the
  # ingress-nginx-admission ValidatingWebhookConfiguration's `caBundle` field, OUT-OF-BAND, after
  # that resource is first created from the raw Helm-rendered manifest (which ships with no/empty
  # caBundle). Without this ignoreDifferences entry, selfHeal has no way to know that field was
  # intentionally patched — the next reconcile after the Job runs reverts the whole resource back to
  # the git-rendered manifest, wiping the patched caBundle back out. The API server then refuses
  # every subsequent Ingress create/update platform-wide with "x509: certificate signed by unknown
  # authority", since it no longer trusts the cert the webhook actually presents — silently breaking
  # any module or core app whose Ingress happens to sync after that point (confirmed live: ui-shell's
  # and gateway's Ingresses both failed this way while keycloak's, synced earlier, was unaffected).
  # jqPathExpressions (not jsonPointers) because `webhooks` is an array — a fixed index would silently
  # stop matching if the chart ever adds/reorders webhook entries.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: ingress-nginx-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
