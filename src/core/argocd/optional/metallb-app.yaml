# Optional-capability root Application — only applied by bootstrap/install.sh
# when MetalLB is wanted (default: yes; opt out with --skip-metallb). Points
# at src/core/argocd/apps/optional/metallb/, the same way root-app.yaml
# points at apps/core/. See src/core/argocd/README.md's "Portability: core
# vs. optional capabilities" section for why this exists as a separate
# root Application instead of just living inside apps/core/.
#
# When this capability is needed: any environment with no cloud provider
# handing out real LoadBalancer IPs underneath k8s for you — a homelab box,
# a self-hosted data centre, or bare k3s/k8s on VMs where you've deliberately
# chosen not to rely on the cloud's own LB service. Skip it (--skip-metallb)
# anywhere a cloud provider already does this — EKS/GKE/AKS, or self-managed
# k8s on cloud VMs using that cloud's LoadBalancer integration — ingress-nginx's
# Service will just pick up a real ELB/NLB/etc. automatically instead.
#
# install.sh substitutes __REPO_URL__ / __REVISION__ before applying this,
# same as root-app.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: optional-metallb
  namespace: argocd
  labels:
    platform.io/tier: optional
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: src/core/argocd/apps/optional/metallb
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
