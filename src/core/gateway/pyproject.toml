[project]
name = "gateway"
version = "0.1.0"
description = "platform-gateway — verifies Keycloak JWTs, proxies to catalog-service with derived, trustworthy X-Workspace/X-User/X-Role headers (ARCHITECTURE.md §2 layer 3, §3, §10). platform-gateway-auth branch, 2026-09-02."
requires-python = ">=3.12"
# No `readme = "README.md"` — same reasoning as catalog-service/pyproject.toml's
# own comment: this is only ever `pip install`ed locally (editable, dev) or
# baked into the Docker image, and the Dockerfile deliberately does NOT COPY
# README.md into the build (see .dockerignore), so declaring it here would
# break `pip install .` inside the actual container build.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function-call-in-default-argument) is a false positive for FastAPI's
# own Depends(...)/Header(...)-as-default pattern — same exclusion
# catalog-service/pyproject.toml uses, for the same reason.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto, not per-test @pytest.mark.asyncio decorators — every async test
# function in this suite (test_jwks.py's JWKSCache tests especially) is
# meant to run as a coroutine; opting in per-function would just be
# boilerplate repeated on every single one with no offsetting benefit.
asyncio_mode = "auto"
