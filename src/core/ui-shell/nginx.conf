# First nginx.conf in this repo — kept deliberately minimal (no
# gzip/caching/security-header tuning at this scope; see this package's
# README for what's not built yet). The only thing that actually matters
# for a client-side-routed SPA: unknown paths fall back to index.html
# instead of 404ing, so React Router (or whatever item 5 ends up using)
# can handle routing client-side.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
