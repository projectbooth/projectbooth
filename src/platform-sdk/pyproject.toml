[project]
name = "platform-sdk"
version = "0.1.0"
description = "The typed Python client for catalog-service, plus (later) the @platform.dataset / @platform.pipeline / @platform.function self-registration decorators ARCHITECTURE.md §4 describes. This first pass is the client only — workspaces + datasets, the minimal slice that proves the pattern end-to-end (ARCHITECTURE.md's other four catalog-service resource types are structurally identical, per that service's own crud.py, so adding them later is repetition, not redesign)."
requires-python = ">=3.12"
# Same "no readme field" reasoning as catalog-service/pyproject.toml would
# apply if this were ever built into a container — it isn't (this is a
# library, `pip install`ed editable by platform-cli and, eventually, by
# user code), but omitting it here too keeps the two packages' pyproject
# conventions identical rather than diverging for no reason.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "respx>=0.21",   # mocks httpx at the transport level — see tests/test_client.py's docstring
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
